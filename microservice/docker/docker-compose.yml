version: '3.9'
services:
  ampep-microservice:
    build:
      context: ../../
      dockerfile: microservice/docker/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - R_LOG_LEVEL=INFO
      - PLUMBER_PORT=8001
      - PLUMBER_HOST=0.0.0.0
      - MODEL_PATH=/app/same_def_matlab_100tree_11mtry_rf.mdl
    volumes:
      - ../logs:/app/logs
      - ../data:/app/data
    networks:
      - axpep-ecosystem-network
    healthcheck:
      test: ["CMD", "curl", "-f", "--max-time", "8", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    # Memory limit prevents runaway R process from consuming all server RAM
    mem_limit: 4g
    memswap_limit: 4g
    labels:
      - "autoheal=true"

  # autoheal automatically restarts containers that become unhealthy
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal-ampep
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
      - CURL_TIMEOUT=30

networks:
  axpep-ecosystem-network:
    external: true

  # Optional: Add monitoring stack
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ampep-network
      - axpep-ecosystem-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      - ampep-network
      - axpep-ecosystem-network
    profiles:
      - monitoring

networks:
  ampep-network:
    driver: bridge
  axpep-ecosystem-network:
    external: true

volumes:
  grafana-storage: 
